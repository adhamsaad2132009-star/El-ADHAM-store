<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EL-ADHAM STORE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    /* الهيدر */
    header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 5;
      box-shadow: 0 3px 15px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    header p {
      margin: 7px 0 0;
      color: #d1d5db;
      font-size: 14px;
    }

    /* العنوان */
    .hero {
      text-align: center;
      padding: 35px 15px 20px;
    }

    .hero h2 {
      margin: 0;
      font-size: 25px;
    }

    .hero p {
      color: #6b7280;
      margin-top: 8px;
    }

    /* المنتجات */
    .container {
      max-width: 1100px;
      margin: auto;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      transition: .25s;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,.14);
    }

    .shirt {
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      background: #f9fafb;
    }

    .blue {
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
    }

    .black {
      background: linear-gradient(135deg, #111827, #374151);
    }

    .white {
      background: linear-gradient(135deg, #e5e7eb, #ffffff);
    }

    .red {
      background: linear-gradient(135deg, #fee2e2, #fff1f2);
    }

    .info {
      padding: 18px;
    }

    .name {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .desc {
      color: #6b7280;
      font-size: 13px;
      min-height: 36px;
    }

    .price {
      color: #16a34a;
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 11px 14px;
      margin: 3px;
      font-size: 14px;
      cursor: pointer;
      color: white;
      transition: .2s;
    }

    button:hover {
      opacity: .85;
    }

    .details {
      background: #2563eb;
    }

    .buy {
      background: #16a34a;
    }

    /* النافذة */
    #detailsModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #detailsContent {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 18px;
      padding: 25px;
      text-align: right;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    #detailName {
      margin-top: 0;
    }

    #detailDesc {
      color: #555;
      line-height: 1.8;
    }

    #closeBtn {
      background: #dc2626;
      width: 100%;
      margin-top: 15px;
    }

    /* الفوتر */
    footer {
      margin-top: 45px;
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    footer p {
      margin: 5px;
      color: #d1d5db;
    }

    @media (max-width: 500px) {
      header h1 {
        font-size: 24px;
      }

      .hero h2 {
        font-size: 22px;
      }

      .container {
        grid-template-columns: 1fr;
        max-width: 380px;
      }

      .shirt {
        height: 240px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>EL-ADHAM STORE 🛍️</h1>
    <p>ستايلك يبدأ من هنا 👕</p>
  </header>

  <section class="hero">
    <h2>أحدث التيشيرتات 🔥</h2>
    <p>اختار التيشيرت اللي يناسبك</p>
  </section>

  <div class="container" id="productsContainer"></div>

  <div id="detailsModal">
    <div id="detailsContent">
      <h2 id="detailName"></h2>
      <p id="detailDesc"></p>
      <button id="closeBtn">إغلاق</button>
    </div>
  </div>

  <footer>
    <p><strong>EL-ADHAM STORE</strong></p>
    <p>© 2026 جميع الحقوق محفوظة</p>
  </footer>

  <script>
    const products = [
      {
        name: "تيشيرت أزرق",
        price: "150 جنيه",
        icon: "👕",
        color: "blue",
        description: "تيشيرت أزرق أنيق ومريح، مناسب للاستخدام اليومي."
      },
      {
        name: "تيشيرت أسود",
        price: "700 جنيه",
        icon: "👕",
        color: "black",
        description: "تيشيرت أسود كلاسيكي بتصميم بسيط يناسب كل الإطلالات."
      },
      {
        name: "تيشيرت أبيض",
        price: "700 جنيه",
        icon: "👕",
        color: "white",
        description: "تيشيرت أبيض بسيط وأنيق، مناسب للصيف والاستخدام اليومي."
      },
      {
        name: "تيشيرت أحمر",
        price: "700 جنيه",
        icon: "👕",
        color: "red",
        description: "تيشيرت أحمر بتصميم شبابي ومميز."
      }
    ];

    const container = document.getElementById("productsContainer");
    const modal = document.getElementById("detailsModal");
    const detailName = document.getElementById("detailName");
    const detailDesc = document.getElementById("detailDesc");

    products.forEach((product, index) => {
      const card = document.createElement("div");

      card.className = "card";

      card.innerHTML = `
        <div class="shirt ${product.color}">
          ${product.icon}
        </div>

        <div class="info">
          <div class="name">${product.name}</div>

          <div class="desc">
            ${product.description}
          </div>

          <div class="price">
            ${product.price}
          </div>

          <button class="details" onclick="showDetails(${index})">
            تفاصيل أكثر
          </button>

          <button class="buy" onclick="buyNow('${product.name}')">
            اشترِ الآن
          </button>
        </div>
      `;

      container.appendChild(card);
    });

    function showDetails(index) {
      detailName.textContent = products[index].name;
      detailDesc.textContent = products[index].description;
      modal.style.display = "flex";
    }

    document.getElementById("closeBtn").onclick = function() {
      modal.style.display = "none";
    };

    modal.onclick = function(event) {
      if (event.target === modal) {
        modal.style.display = "none";
      }
    };

    function buyNow(name) {
      alert(
        "🛒 اخترت: " + name +
        "\n\nشكراً لطلبك من EL-ADHAM STORE ❤️"
      );
    }
  </script>

</body>
</html>
