<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <title>متجر التيشرتات</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      direction: rtl;
      background-color: #f9f9f9;
      padding: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 250px;
      padding: 15px;
      text-align: center;
    }
    .card img {
      width: 100%;
      border-radius: 8px;
    }
    .name {
      margin: 10px 0 5px;
      font-weight: bold;
      font-size: 18px;
    }
    .price {
      color: #3a8;
      font-size: 16px;
      margin-bottom: 10px;
    }
    button {
      background-color: #2979ff;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #1565c0;
    }
    #detailsModal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    #detailsContent {
      background: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 400px;
      text-align: right;
    }
    #closeBtn {
      background: #f44336;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>متجر التيشرتات</h1>
  <div class="container" id="productsContainer">

    <!-- التيشرتات هتظهر هنا -->

  </div>

  <div id="detailsModal">
    <div id="detailsContent">
      <h2 id="detailName"></h2>
      <p id="detailDesc"></p>
      <button id="closeBtn">إغلاق</button>
    </div>
  </div>

  <script>
    const products = [
      {
        name: "تيشيرت أزرق",
        price: "150 جنيه",
        image: "https://via.placeholder.com/250x250/007bff/ffffff?text=Blue+T-shirt",
        description: "تيشيرت أزرق مصنوع من قطن ناعم ومريح."
      },
      {
        name: "تيشيرت أسود",
        price: "180 جنيه",
        image: "https://via.placeholder.com/250x250/000000/ffffff?text=Black+T-shirt",
        description: "تيشيرت أسود كلاسيكي يناسب كل الأوقات."
      },
      {
        name: "تيشيرت أبيض",
        price: "140 جنيه",
        image: "https://via.placeholder.com/250x250/ffffff/000000?text=White+T-shirt",
        description: "تيشيرت أبيض بأناقة بسيطة وتصميم مريح."
      }
    ];

    const container = document.getElementById('productsContainer');
    const detailsModal = document.getElementById('detailsModal');
    const detailName = document.getElementById('detailName');
    const detailDesc = document.getElementById('detailDesc');
    const closeBtn = document.getElementById('closeBtn');

    products.forEach((product, index) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.innerHTML = `
        <img src="${product.image}" alt="${product.name}" />
        <div class="name">${product.name}</div>
        <div class="price">${product.price}</div>
        <button onclick="showDetails(${index})">تفاصيل أكثر</button>
        <button onclick="buyNow('${product.name}')">اشترِ الآن</button>
      `;
      container.appendChild(card);
    });

    function showDetails(index) {
      detailName.textContent = products[index].name;
      detailDesc.textContent = products[index].description;
      detailsModal.style.display = "flex";
    }

    closeBtn.onclick = () => {
      detailsModal.style.display = "none";
    };

    function buyNow(name) {
      alert(`شكراً لاختيارك ${name}! سيتم تحويلك لصفحة الدفع قريباً.`);
      // هنا ممكن تضيف عملية الدفع لاحقاً
    }
  </script>	
</body>
</html>
